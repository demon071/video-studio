[package]
name = "short-video-ai"
version = "0.1.0"
description = "Short-Form Video Editor — Windows desktop shell"
authors = ["ShortVideoAI"]
edition = "2021"
rust-version = "1.77.2"

# `lib` is required so the same codebase can target desktop and (later) mobile.
[lib]
name = "short_video_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
